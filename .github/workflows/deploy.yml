name: Публикация на GitHub Pages

# Сборка и публикация при каждом изменении основной ветки.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.1
          cache: true

      - run: flutter pub get

      # Проверка кода: при замечаниях публикация не выполняется.
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

      # Адрес API задаётся переменной репозитория API_BASE_URL
      # (Settings → Secrets and variables → Actions → Variables).
      - name: Сборка
        run: >
          flutter build web --release
          --base-href /${{ github.event.repository.name }}/
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      # GitHub Pages отдаёт 404.html для неизвестных адресов: копия
      # index.html открывает приложение по прямой ссылке на внутренний экран.
      - run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
